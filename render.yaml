databases:
  - name: aiapp-db
    plan: free
    databaseName: aiapp
    user: aiapp

services:
  - type: web
    name: aiapp-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn ai_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aiapp-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
